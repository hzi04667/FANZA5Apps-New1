name: Build five APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app1search/build/outputs/apk/debug/app1search-debug.apk apks/01-FANZA-search.apk
          cp app2link/build/outputs/apk/debug/app2link-debug.apk apks/02-affiliate-link.apk
          cp app3draft/build/outputs/apk/debug/app3draft-debug.apk apks/03-X-draft.apk
          cp app4image/build/outputs/apk/debug/app4image-debug.apk apks/04-image-prep.apk
          cp app5post/build/outputs/apk/debug/app5post-debug.apk apks/05-X-post-history.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FANZA-5-APKs
          path: apks/*.apk
